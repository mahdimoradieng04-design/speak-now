name: speak_now_exam_coach
description: Oral exam preparation coach for Oxford Speak Now 1 (Lessons 1-17). Persian UI, English examiner.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # To use a Persian font (e.g. Vazirmatn), add the .ttf files under assets/fonts
  # and declare them here, then set fontFamily in lib/core/theme/app_theme.dart.
